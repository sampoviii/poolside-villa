<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poolside Villa</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .test-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #ddd;
        }
        .test-item.success { border-left-color: #28a745; background: #f0f9f4; }
        .test-item.error { border-left-color: #dc3545; background: #fef5f5; }
        .test-item.loading { border-left-color: #ffc107; background: #fffbf0; }
        .test-title {
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .test-message {
            font-size: 14px;
            color: #666;
        }
        .icon { font-size: 20px; }
        .code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 10px;
            overflow-x: auto;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover { background: #5568d3; }
        .timestamp {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Standalone diagnostic page that checks whether the site's APIs and database respond. -->
    <div class="container">
        <h1>🏊 Poolside Villa</h1>
        <p class="subtitle">System Connection Test</p>

        <div id="test1" class="test-item loading">
            <div class="test-title">
                <span class="icon">⏳</span>
                <span>Test 1: API Connection</span>
            </div>
            <div class="test-message">Testing connection to API...</div>
        </div>

        <div id="test2" class="test-item loading">
            <div class="test-title">
                <span class="icon">⏳</span>
                <span>Test 2: Database Connection</span>
            </div>
            <div class="test-message">Testing MySQL database...</div>
        </div>

        <div id="test3" class="test-item loading">
            <div class="test-title">
                <span class="icon">⏳</span>
                <span>Test 3: Reviews API</span>
            </div>
            <div class="test-message">Fetching reviews from database...</div>
        </div>

        <div id="test4" class="test-item loading">
            <div class="test-title">
                <span class="icon">⏳</span>
                <span>Test 4: Settings API</span>
            </div>
            <div class="test-message">Loading resort settings...</div>
        </div>

        <button onclick="location.reload()">🔄 Run Tests Again</button>
        <button onclick="window.location.href='index.html'" style="background: #28a745;">✓ Go to Landing Page</button>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        const API_BASE = 'api/';

        function updateTest(testId, status, title, message, data) {
            const el = document.getElementById(testId);
            el.className = `test-item ${status}`;
            
            const icons = {
                success: '✓',
                error: '✖',
                loading: '⏳'
            };

            let html = `
                <div class="test-title">
                    <span class="icon">${icons[status]}</span>
                    <span>${title}</span>
                </div>
                <div class="test-message">${message}</div>
            `;

            if (data) {
                html += `<div class="code">${JSON.stringify(data, null, 2)}</div>`;
            }

            el.innerHTML = html;
        }

        async function runTests() {
            document.getElementById('timestamp').textContent = `Test started at ${new Date().toLocaleString()}`;

            // Test 1: Basic API Connection
            try {
                const response = await fetch(API_BASE + 'reviews.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'all_list' })
                });

                if (response.ok) {
                    updateTest('test1', 'success', 'Test 1: API Connection', 
                        `✓ Successfully connected to ${API_BASE}reviews.php`, 
                        { status: response.status, statusText: response.statusText });
                } else {
                    updateTest('test1', 'error', 'Test 1: API Connection', 
                        `✖ HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                updateTest('test1', 'error', 'Test 1: API Connection', 
                    `✖ Connection failed: ${error.message}`, 
                    { error: error.toString() });
            }

            // Test 2: Database Connection (via API response)
            try {
                const response = await fetch(API_BASE + 'reviews.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'all_list' })
                });

                const result = await response.json();

                if (result.ok !== undefined) {
                    updateTest('test2', 'success', 'Test 2: Database Connection', 
                        `✓ Database is connected and responding`, 
                        { database: 'poolside_villa', status: 'connected', result: result });
                } else {
                    updateTest('test2', 'error', 'Test 2: Database Connection', 
                        `✖ Unexpected API response format`);
                }
            } catch (error) {
                updateTest('test2', 'error', 'Test 2: Database Connection', 
                    `✖ Database error: ${error.message}`);
            }

            // Test 3: Reviews API
            try {
                const response = await fetch(API_BASE + 'reviews.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'all_list' })
                });

                const result = await response.json();

                if (result.ok && result.reviews) {
                    updateTest('test3', 'success', 'Test 3: Reviews API', 
                        `✓ Found ${result.reviews.length} review(s) in database`, 
                        { count: result.reviews.length, sample: result.reviews[0] || 'No reviews yet' });
                } else {
                    updateTest('test3', 'error', 'Test 3: Reviews API', 
                        `✖ ${result.error || 'Unknown error'}`);
                }
            } catch (error) {
                updateTest('test3', 'error', 'Test 3: Reviews API', 
                    `✖ API call failed: ${error.message}`);
            }

            // Test 4: Settings API
            try {
                const response = await fetch(API_BASE + 'settings.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get' })
                });

                const result = await response.json();

                if (result.ok) {
                    updateTest('test4', 'success', 'Test 4: Settings API', 
                        `✓ Settings loaded successfully`, 
                        { gcashNumber: result.gcashNumber || 'Not set', gcashQr: result.gcashQr ? 'Configured' : 'Not set' });
                } else {
                    updateTest('test4', 'error', 'Test 4: Settings API', 
                        `✖ ${result.error || 'Unknown error'}`);
                }
            } catch (error) {
                updateTest('test4', 'error', 'Test 4: Settings API', 
                    `✖ API call failed: ${error.message}`);
            }
        }

        // Run tests when page loads
        runTests();
    </script>
</body>
</html>
